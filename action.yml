name: 'AI Review'
description: >-
  AI-powered pull request review focused on production risk — business
  logic, security, reliability, and performance, not style. A drop-in
  GitHub Action for any language or stack.
author: 'blackstalk'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  anthropic-api-key:
    description: >-
      Anthropic API key (pass as a GitHub secret). If unset, the review
      is skipped gracefully and this action exits 0 — an unavailable AI
      reviewer must never become a way to block all merges.
    required: false
  provider:
    description: 'Reviewer provider. Currently implemented: anthropic.'
    required: false
    default: 'anthropic'
  model:
    description: 'Model name to use for review.'
    required: false
    default: 'claude-opus-5'
  base-ref:
    description: >-
      Git ref to diff HEAD against, e.g. origin/main. Typically set to
      "origin/" followed by the PR's base branch name — see README for a
      full example. Requires the calling workflow to check out with
      fetch-depth 0.
    required: true
  exclude-paths:
    description: >-
      Comma- or space-separated pathspecs to exclude from the reviewed
      diff, e.g. "vendor node_modules examples". Useful for excluding
      generated code, vendored dependencies, or intentionally-vulnerable
      example/fixture directories.
    required: false
    default: ''
  fail-on-severity:
    description: >-
      Comma-separated severities that fail this check. Findings below
      this threshold are still posted as informational.
    required: false
    default: 'CRITICAL,HIGH'
  system-prompt-path:
    description: >-
      Path (relative to the consuming repo's working directory) to a
      custom reviewer system prompt. Defaults to this action's bundled
      prompts/code-review.md.
    required: false
    default: ''
  max-diff-bytes:
    description: >-
      Skip the review (non-blocking) if the diff exceeds this many bytes.
      Guards against generated files blowing past the model's context
      window. Default 600000, roughly 150k tokens.
    required: false
    default: '600000'
  max-context-bytes:
    description: >-
      Budget for the full contents of changed files, sent alongside the
      diff so the reviewer can resolve identifiers declared outside the
      changed hunks. Without it a declaration sitting outside a hunk looks
      undefined. Default 400000, roughly 100k tokens; 0 sends the diff alone.
    required: false
    default: '400000'
  post-comment:
    description: 'Whether to post/update a PR comment with findings.'
    required: false
    default: 'true'
  github-token:
    description: >-
      Token used to post the PR comment. Defaults to the workflow's own
      GITHUB_TOKEN at the call site (see the "Post or update PR comment"
      step) — action metadata `inputs.*.default` fields can't reference
      the `github` context directly, so the fallback lives there instead.
    required: false
    default: ''

outputs:
  findings-file:
    description: 'Path to the markdown findings file written by this run.'
    value: ${{ steps.review.outputs.findings-file }}
  blocking-count:
    description: 'Number of findings at or above the fail-on-severity threshold.'
    value: ${{ steps.review.outputs.blocking-count }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run AI review
      id: review
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AI_REVIEW_PROVIDER: ${{ inputs.provider }}
        AI_REVIEW_MODEL: ${{ inputs.model }}
        BASE_REF: ${{ inputs.base-ref }}
        EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        SYSTEM_PROMPT_PATH: ${{ inputs.system-prompt-path }}
        MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        MAX_CONTEXT_BYTES: ${{ inputs.max-context-bytes }}
      run: python "${{ github.action_path }}/ai_review.py" --base-ref "$BASE_REF" --output ai-review-comment.md

    - name: Post or update PR comment
      if: inputs.post-comment == 'true' && always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const fs = require('fs');
          // This step runs with always(), so it must tolerate the review
          // step having died before writing its output — otherwise an
          // ENOENT here masks the real failure upstream.
          let body;
          try {
            body = fs.readFileSync('ai-review-comment.md', 'utf8');
          } catch (err) {
            body = '## AI Review\n\nThe review step failed before producing output. '
              + 'See the workflow logs for the underlying error. Treat this as a '
              + 'tooling failure, not a signal about the code.';
          }
          const marker = '<!-- ai-review-action -->';
          const commentBody = `${marker}\n${body}`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: commentBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody,
            });
          }
